# Null audio sink for PipeWire on r8s (Exynos ABOX DSP has no mainline driver).
# Adapted from sources/port/device/audio/10-null-sink.conf.
# Keeps audio-enumerating apps (browsers, SDL, etc.) from failing when no USB-C
# DAC or Bluetooth audio device is attached, while allowing real devices to take
# priority automatically.
context.objects = [
    {   factory = adapter
        args = {
            factory.name          = support.null-audio-sink
            node.name             = "r8s-silent-output"
            node.description      = "Phone Output (no audio device connected)"
            media.class           = Audio/Sink
            audio.position        = [ FL FR ]
            audio.rate            = 48000
            monitor.channel-volumes = true
            priority.session      = 100
            priority.driver       = 100
        }
    }
]
