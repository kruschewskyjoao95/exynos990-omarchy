# systemd user environment for /opt/mesa-g77 on r8s (Exynos 990 / Mali-G77).
# Inherited by UWSM, Hyprland, Quickshell, Xwayland, and portals via systemd --user.
# Do NOT force XDG_RUNTIME_DIR here: systemd-logind/PAM manages /run/user/$UID.

LD_LIBRARY_PATH=/opt/mesa-g77/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
__EGL_VENDOR_LIBRARY_FILENAMES=/opt/mesa-g77/share/glvnd/egl_vendor.d/50_mesa.json
LIBGL_DRIVERS_PATH=/opt/mesa-g77/lib/dri
GBM_BACKENDS_PATH=/opt/mesa-g77/lib/gbm
VK_DRIVER_FILES=${VK_DRIVER_FILES:-/opt/mesa-g77/share/vulkan/icd.d/panfrost_icd.aarch64.json}
VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-/opt/mesa-g77/share/vulkan/icd.d/panfrost_icd.aarch64.json}
PAN_MESA_DEBUG=${PAN_MESA_DEBUG:-noafbc}
PAN_I_WANT_A_BROKEN_VULKAN_DRIVER=${PAN_I_WANT_A_BROKEN_VULKAN_DRIVER:-1}
