# Systemd service drop-in for SDDM (Wayland greeter) to use /opt/mesa-g77.
# Installed to /usr/lib/systemd/system/sddm.service.d/20-r8s-mesa-g77.conf
# Note: systemd [Service] Environment= does not expand ${VAR:+...}; use literal paths.
[Service]
Environment="LD_LIBRARY_PATH=/opt/mesa-g77/lib"
Environment="__EGL_VENDOR_LIBRARY_FILENAMES=/opt/mesa-g77/share/glvnd/egl_vendor.d/50_mesa.json"
Environment="LIBGL_DRIVERS_PATH=/opt/mesa-g77/lib/dri"
Environment="GBM_BACKENDS_PATH=/opt/mesa-g77/lib/gbm"
Environment="VK_DRIVER_FILES=/opt/mesa-g77/share/vulkan/icd.d/panfrost_icd.aarch64.json"
Environment="VK_ICD_FILENAMES=/opt/mesa-g77/share/vulkan/icd.d/panfrost_icd.aarch64.json"
Environment="PAN_MESA_DEBUG=noafbc"
Environment="PAN_I_WANT_A_BROKEN_VULKAN_DRIVER=1"
